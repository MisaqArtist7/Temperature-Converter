<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Temperature Converter</title>

<link rel="stylesheet" href="assets/style/output.css">

</head>

<body class="min-h-screen bg-gray-100 text-gray-900 flex items-center justify-center px-4">


<main id="app-main" class="w-full max-w-md">

    <section id="converter-card" class="rounded-2xl bg-white p-6 shadow-lg">

        <h1 id="app-title" class="mb-6 text-2xl font-bold text-center">
            Temperature Converter
        </h1>

        <form id="temperature-form" class="space-y-4">

            <!-- Temperature -->
            <div id="temperature-field">
                <label
                    for="temperature-input"
                    class="mb-2 block text-sm font-medium"
                >
                    Temperature
                </label>

                <input
                    id="temperature-input"
                    type="number"
                    placeholder="Enter temperature..."
                    class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 outline-none focus:border-blue-500"
                >
            </div>

            <!-- From Unit -->
            <div id="from-unit-field">
                <label
                    for="from-unit-select"
                    class="mb-2 block text-sm font-medium"
                >
                    From
                </label>

                <select
                    id="from-unit-select"
                    class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 outline-none focus:border-blue-500"
                >
                    <option value="">Select unit</option>
                    <option value="celsius">Celsius</option>
                    <option value="fahrenheit">Fahrenheit</option>
                    <option value="kelvin">Kelvin</option>
                </select>
            </div>

            <!-- To Unit -->
            <div id="to-unit-field">
                <label
                    for="to-unit-select"
                    class="mb-2 block text-sm font-medium"
                >
                    To
                </label>

                <select
                    id="to-unit-select"
                    class="w-full rounded-lg border border-gray-300 bg-white px-4 py-3 outline-none focus:border-blue-500"
                >
                    <option value="">Select unit</option>
                    <option value="celsius">Celsius</option>
                    <option value="fahrenheit">Fahrenheit</option>
                    <option value="kelvin">Kelvin</option>
                </select>
            </div>

            <!-- Convert Button -->
            <button
                id="convert-btn"
                type="submit"
                disabled
                class="w-full rounded-lg bg-blue-500 px-5 py-3 font-medium text-white transition hover:bg-blue-600 disabled:cursor-not-allowed disabled:bg-gray-300"
            >
                Convert
            </button>

        </form>

        <!-- Result -->
        <section
            id="result-container"
            class="mt-6 hidden rounded-lg bg-gray-100 p-4 text-center"
        >
            <p class="mb-1 text-sm text-gray-500">
                Result
            </p>

            <p
                id="result-value"
                class="text-2xl font-bold"
            ></p>
        </section>

    </section>

</main>


<script src="assets/js/app.js"></script>


</body>
</html>
